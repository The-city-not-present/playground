# DHCP + TFTP server for Xiaomi Mi Router 4A Gigabit U-Boot recovery.
# Active attempt: reflash-attempt-20261122.
#
# Run as root (stop any stale tftpserver.py / dnsmasq first — both bind :69):
#   sudo dnsmasq --conf-file=/home/andrej/work/xiaomi-openwrt-restore/reflash-attempt-20261122/assets/dnsmasq-recovery.conf --no-daemon

interface=enp7s0
bind-interfaces

# no DNS here, only DHCP + TFTP
port=0

dhcp-authoritative
dhcp-range=192.168.31.1,192.168.31.1,255.255.255.0,1h
dhcp-option=3,192.168.31.100

enable-tftp
tftp-root=/home/andrej/work/xiaomi-openwrt-restore/reflash-attempt-20261122/assets/tftp-root

# What file U-Boot should request (change per step):
#   step 01 (initramfs, expected fail):  test.bin
#   step 02/03 (stock firmware):         miwifi.bin
dhcp-boot=test.bin,192.168.31.100,192.168.31.100

log-dhcp
log-queries
