# DHCP + TFTP server for Xiaomi Mi Router 4A Gigabit U-Boot recovery.
#
# The broken router currently broadcasts DHCP DISCOVER (it is a DHCP client in
# recovery), so we answer it AND serve the initramfs over TFTP in one process.
#
# Run as root (stop the standalone tftpserver.py first — it also binds :69):
#   sudo dnsmasq --conf-file=/home/andrej/work/xiaomi-openwrt-restore/reflash/dnsmasq-recovery.conf --no-daemon

# Only talk on the Ethernet link to the broken router (do NOT touch WiFi/wlp6s0).
interface=enp7s0
bind-interfaces

# We don't need DNS here, only DHCP + TFTP.
port=0

# Answer authoritatively; hand the router the fixed recovery IP 192.168.31.1.
dhcp-authoritative
dhcp-range=192.168.31.1,192.168.31.1,255.255.255.0,1h
dhcp-option=3,192.168.31.100

# Serve the initramfs image over TFTP (tftp-root already holds test.bin,
# miwifi.bin, initramfs.bin and the full filename).
enable-tftp
tftp-root=/home/andrej/work/xiaomi-openwrt-restore/reflash/tftp-root

# Tell the DHCP client where the TFTP server is and what bootfile to request.
dhcp-boot=test.bin,192.168.31.100,192.168.31.100

# Log the DHCP handshake and the TFTP requests so we can see what happens.
log-dhcp
log-queries
